# cc-kfuzz -> cc-fuzzer dependency surface. Checked by bin/kfuzz-compat.
#   tested_ref=<sha>                   cc-fuzzer commit this release was tested against (NOTE on mismatch)
#   name=<plugin name>                 must equal cc-fuzzer's .claude-plugin/plugin.json "name"
#   require=<path>                     file must exist (FAIL)
#   grep=<path>:<fixed string>         string must appear in file (FAIL)
#   adapted=<src> -> <dst> blob=<sha>  cc-kfuzz file adapted from upstream <src>; blob is
#                                      `git hash-object <src>` at tested_ref. src missing = FAIL,
#                                      blob changed = NOTE (port by hand; see README "Bumping cc-fuzzer").
tested_ref=ff2598ec27caba9180bbac5d1500d682ef8aeb6b
name=cc-fuzzer

# reuse-as-is
require=STATE_SCHEMA.md
require=agents/code-reviewer.md
require=agents/code-reviewer-deep.md
require=agents/planner-consult.md
require=agents/ops-runner.md
require=agents/query-analyst.md
require=skills/fuzz-review/SKILL.md
require=skills/delta-sweep/SKILL.md
require=scripts/integrity-check.sh
require=scripts/blame-finding.sh
require=rules/semgrep/c-cpp-memory.yml

# contracts
grep=STATE_SCHEMA.md:YOLO_NEXT: dispatch agent=
grep=STATE_SCHEMA.md:YOLO_NEXT: run script=
grep=STATE_SCHEMA.md:YOLO_NEXT: schedule delay=
grep=STATE_SCHEMA.md:YOLO_NEXT: halt reason=
# cc-fuzzer's write gate: before 0.49.2 it refused any path with a "findings" component
# under any parent, which is why kfuzz keeps verified bundles in kfuzz/verified/; since
# 0.49.2 it protects fuzz/findings/ only. A rename of the constant is worth a look.
grep=src/cc_fuzzer_core/gate.py:FINDINGS_DIR = "findings"

